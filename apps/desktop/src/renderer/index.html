<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHODASHA Browser</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="browser">
      <div id="progress" class="progress" aria-hidden="true"></div>

      <header class="toolbar">
        <div class="nav-controls">
          <button
            id="btn-back"
            class="icon-button"
            title="Back"
            aria-label="Back"
            disabled
          >
            &#8592;
          </button>
          <button
            id="btn-forward"
            class="icon-button"
            title="Forward"
            aria-label="Forward"
            disabled
          >
            &#8594;
          </button>
          <button
            id="btn-reload"
            class="icon-button"
            title="Reload"
            aria-label="Reload"
          >
            &#8635;
          </button>
          <button
            id="btn-stop"
            class="icon-button"
            title="Stop loading"
            aria-label="Stop loading"
            hidden
          >
            &#10005;
          </button>
        </div>

        <div class="address-area">
          <span id="security" class="secure-state state-none"></span>
          <input
            id="address-bar"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="Search or enter an address"
            aria-label="Address and search bar"
          />
        </div>

        <div class="toolbar-actions">
          <button
            id="btn-shield"
            class="icon-button shield-button"
            title="SHODASHA Shield"
            aria-label="SHODASHA Shield"
            aria-expanded="false"
            aria-haspopup="true"
          >
            <svg
              class="shield-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 22s8-3.6 8-10V5l-8-3-8 3v7c0 6.4 8 10 8 10z"></path>
            </svg>
          </button>
          <button
            id="btn-new-tab"
            class="icon-button"
            title="New tab"
            aria-label="New tab"
          >
            +
          </button>
          <button
            id="btn-menu"
            class="icon-button"
            title="Menu"
            aria-label="Menu"
          >
            &#8942;
          </button>

          <section id="shield-panel" class="shield-panel" hidden aria-label="SHODASHA Shield panel">
            <header class="shield-panel-header">
              <span class="shield-panel-title">SHODASHA SHIELD</span>
              <span id="shield-protection" class="shield-badge shield-badge-on">ON</span>
            </header>
            <dl class="shield-stats">
              <div class="shield-stat">
                <dt>Requests evaluated</dt>
                <dd id="shield-stat-evaluated">0</dd>
              </div>
              <div class="shield-stat">
                <dt>Requests filtered</dt>
                <dd id="shield-stat-filtered">0</dd>
              </div>
              <div class="shield-stat">
                <dt>Trackers</dt>
                <dd id="shield-stat-trackers">0</dd>
              </div>
              <div class="shield-stat">
                <dt>Ads</dt>
                <dd id="shield-stat-ads">0</dd>
              </div>
            </dl>
            <div class="shield-site-line">
              <span>This site</span>
              <span id="shield-site-stats" class="shield-setting-value">&mdash;</span>
            </div>
            <div class="shield-recent" id="shield-recent" hidden>
              <div class="shield-recent-title">Recent activity</div>
              <ul id="shield-recent-list" class="shield-recent-list"></ul>
            </div>
            <div class="shield-setting-row">
              <span class="shield-setting-label">Protection Mode</span>
              <select id="shield-mode" class="shield-select">
                <option value="standard">Standard</option>
                <option value="strict">Strict</option>
                <option value="custom">Custom</option>
              </select>
            </div>
            <div class="shield-actions">
              <button type="button" id="shield-toggle" class="shield-action-btn" aria-pressed="true">
                Shield ON
              </button>
              <button type="button" id="shield-site-settings" class="shield-action-btn">
                Site Settings
              </button>
            </div>
          </section>

          <section id="site-settings-panel" class="shield-panel site-settings-panel" hidden aria-label="Site settings panel">
            <header class="shield-panel-header">
              <span class="shield-panel-title">Site Settings</span>
              <button
                type="button"
                id="site-settings-close"
                class="shield-close"
                title="Close site settings"
                aria-label="Close site settings"
              >
                &#10005;
              </button>
            </header>
            <div class="site-setting-row">
              <span class="shield-setting-label">Current Site</span>
              <span id="site-settings-current" class="shield-setting-value">&mdash;</span>
            </div>
            <div class="site-setting-row">
              <span class="shield-setting-label">Shield</span>
              <button type="button" id="site-settings-shield" class="shield-toggle-btn" aria-pressed="true">ON</button>
            </div>
            <div class="site-setting-row">
              <span class="shield-setting-label">Protection Mode</span>
              <select id="site-settings-mode" class="shield-select">
                <option value="standard">Standard</option>
                <option value="strict">Strict</option>
                <option value="custom">Custom</option>
              </select>
            </div>
            <div class="site-setting-row">
              <span class="shield-setting-label">Allowlist</span>
              <button type="button" id="site-settings-allowlist" class="shield-toggle-btn" aria-pressed="false">OFF</button>
            </div>
          </section>

          <nav id="menu" class="menu" hidden>
            <button type="button" data-action="new-tab">New tab</button>
            <button type="button" data-action="close-tab">Close tab</button>
            <button type="button" data-action="reload">Reload</button>
            <button type="button" data-action="reopen-closed">Reopen closed tab</button>
          </nav>
        </div>
      </header>

      <nav id="tab-bar" class="tab-bar" aria-label="Tabs"></nav>

      <main id="content-frame" class="content-frame"></main>

      <section id="new-tab-page" class="new-tab-page" hidden>
        <div class="ntp-mark" aria-hidden="true">S</div>
        <h1 class="ntp-brand">SHODASHA</h1>
        <p class="ntp-tagline">Private. Fast. Yours.</p>
        <input
          id="ntp-search"
          class="ntp-search"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="Search or enter an address"
          aria-label="Search or enter an address"
        />
        <p class="ntp-note">Your browsing stays on this device.</p>
      </section>

      <nav id="tab-context-menu" class="context-menu" hidden>
        <button type="button" data-action="new-tab">New tab</button>
        <button type="button" data-action="reload-tab">Reload tab</button>
        <button type="button" data-action="duplicate-tab">Duplicate tab</button>
        <button type="button" data-action="close-tab">Close tab</button>
        <span class="menu-separator"></span>
        <button type="button" data-action="close-others">Close other tabs</button>
        <button type="button" data-action="close-right">Close tabs to the right</button>
        <span class="menu-separator"></span>
        <button type="button" data-action="reopen-closed">Reopen closed tab</button>
      </nav>
    </div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
